<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses - University Scheduling System</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-brand">
        <div class="sidebar-brand-icon">🎓</div>
        <div class="sidebar-brand-text">
          <span>UniSchedule</span>
          <span>Management System</span>
        </div>
      </a>
      <nav class="sidebar-nav" id="dynamic-sidebar-nav">
    <!-- populated dynamically by base.js based on role -->
</nav>
      <div class="sidebar-footer">University Scheduling System &copy; 2025</div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP BAR -->
      <header class="topbar">
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-left">
          <span class="topbar-title">Courses</span>
          <span class="topbar-subtitle"
            >Manage the university course catalogue</span
          >
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <span id="topbar-user"
                style="font-size:12px;color:var(--text-secondary);font-weight:500;">
          </span>
          <span id="topbar-role" class="topbar-badge"></span>
          <button onclick="logout()"
                  style="background:#fee2e2;color:#dc2626;border:none;
                         padding:7px 14px;border-radius:8px;font-size:12px;
                         font-weight:600;cursor:pointer;
                         font-family:'DM Sans',sans-serif;
                         display:flex;align-items:center;gap:6px;
                         transition:var(--transition);"
                  onmouseover="this.style.background='#fecaca'"
                  onmouseout="this.style.background='#fee2e2'">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
          <button class="btn-primary-custom" onclick="openAddModal()">
            <i class="bi bi-plus-lg"></i> Add Course
          </button>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content">
        <div id="alert-area"></div>

        <!-- FILTER BAR -->
        <div
          style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap"
        >
          <div style="position: relative; flex: 1; min-width: 200px">
            <i
              class="bi bi-search"
              style="
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                font-size: 14px;
              "
            ></i>
            <input
              type="text"
              id="search-input"
              placeholder="Search by code or name..."
              oninput="filterCourses()"
              style="
                width: 100%;
                padding: 9px 14px 9px 36px;
                border: 1.5px solid var(--border);
                border-radius: 8px;
                font-size: 13.5px;
                font-family: &quot;DM Sans&quot;, sans-serif;
                color: var(--text-primary);
                background: white;
              "
            />
          </div>
          <select
            id="level-filter"
            onchange="filterCourses()"
            style="
              padding: 9px 14px;
              border: 1.5px solid var(--border);
              border-radius: 8px;
              font-size: 13.5px;
              font-family: &quot;DM Sans&quot;, sans-serif;
              color: var(--text-primary);
              background: white;
              min-width: 140px;
            "
          >
            <option value="">All Levels</option>
            <option value="1">Level 1</option>
            <option value="2">Level 2</option>
            <option value="3">Level 3</option>
            <option value="4">Level 4</option>
          </select>
          <select
            id="dept-filter"
            onchange="filterCourses()"
            style="
              padding: 9px 14px;
              border: 1.5px solid var(--border);
              border-radius: 8px;
              font-size: 13.5px;
              font-family: &quot;DM Sans&quot;, sans-serif;
              color: var(--text-primary);
              background: white;
              min-width: 180px;
            "
          >
            <option value="">All Departments</option>
          </select>
        </div>

        <!-- TABLE CARD -->
        <div class="card">
          <div class="card-header-custom">
            <h5><i class="bi bi-book"></i> All Courses</h5>
            <span
              id="course-count"
              style="
                font-size: 12px;
                color: var(--text-muted);
                font-weight: 500;
              "
            ></span>
          </div>
          <div class="card-body-custom p-0">
            <div id="courses-table-container">
              <div class="loading-state">
                <div class="spinner-custom"></div>
                <p>Loading courses...</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal fade" id="courseModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content"
          style="
            border-radius: var(--radius-lg);
            border: none;
            overflow: hidden;
          "
        >
          <div class="modal-header-custom">
            <h5 id="modal-title">Add New Course</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" style="padding: 24px">
            <div id="modal-alert"></div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label-custom">Course Code *</label>
                <input
                  type="text"
                  id="f-courseCode"
                  class="form-control-custom"
                  placeholder="e.g. CST2300"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Credits *</label>
                <input
                  type="number"
                  id="f-credits"
                  class="form-control-custom"
                  placeholder="e.g. 3"
                  min="1"
                  max="6"
                />
              </div>
              <div class="col-12">
                <label class="form-label-custom">Course Name *</label>
                <input
                  type="text"
                  id="f-courseName"
                  class="form-control-custom"
                  placeholder="e.g. Advanced Database Systems"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Department *</label>
                <input
                  type="text"
                  id="f-department"
                  class="form-control-custom"
                  placeholder="e.g. Computer Science"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Level (Year) *</label>
                <select id="f-level" class="form-control-custom">
                  <option value="">-- Select Level --</option>
                  <option value="1">Level 1</option>
                  <option value="2">Level 2</option>
                  <option value="3">Level 3</option>
                  <option value="4">Level 4</option>
                </select>
              </div>
            </div>
          </div>
          <div
            class="modal-footer"
            style="padding: 16px 24px; border-top: 1px solid var(--border)"
          >
            <button
              type="button"
              class="btn-danger-custom"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn-primary-custom"
              onclick="saveCourse()"
            >
              <i class="bi bi-check-lg"></i>
              <span id="save-btn-text">Save Course</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script>
      let editingCourseId = null;
      let courseModal;
      let allCourses = [];
      let currentFilteredCourses = [];
      let currentPage = 1;
      const pageSize = 10;

      document.addEventListener("DOMContentLoaded", () => {
        if (!requireAuth(['ADMIN'])) return;
        courseModal = new bootstrap.Modal(
          document.getElementById("courseModal"),
        );
        loadCourses();
      });

      // ============================================================
      // LOAD ALL COURSES
      // ============================================================
      async function loadCourses() {
        const container = document.getElementById("courses-table-container");
        try {
          allCourses = await apiGet("/courses");
          populateDeptFilter();
          filterCourses();
        } catch (err) {
          container.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin:24px;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Failed to load courses: ${err.message}
            </div>`;
        }
      }

      // ============================================================
      // POPULATE DEPARTMENT FILTER DYNAMICALLY
      // ============================================================
      function populateDeptFilter() {
        const depts = [...new Set(allCourses.map((c) => c.department))].sort();
        const select = document.getElementById("dept-filter");
        depts.forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          select.appendChild(opt);
        });
      }

      // ============================================================
      // RENDER TABLE
      // ============================================================
      function renderTable() {
        const container = document.getElementById("courses-table-container");
        document.getElementById("course-count").textContent =
          `${currentFilteredCourses.length} course(s)`;

        if (currentFilteredCourses.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-book"></i>
                <p>No courses found.</p>
            </div>`;
          return;
        }

        const levelColors = {
          1: "badge-success",
          2: "badge-info",
          3: "badge-warning",
          4: "badge-primary",
        };

        const deptColors = [
          "#2a5298",
          "#0891b2",
          "#16a34a",
          "#d97706",
          "#7c3aed",
          "#dc2626",
        ];

        // Assign consistent colors to departments
        const depts = [...new Set(allCourses.map((c) => c.department))];
        const deptColorMap = {};
        depts.forEach(
          (d, i) => (deptColorMap[d] = deptColors[i % deptColors.length]),
        );

        container.innerHTML = `
        <div style="overflow-x:auto;">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Department</th>
                    <th>Level</th>
                    <th>Credits</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${paginateData(currentFilteredCourses, currentPage, pageSize)
                  .map(
                    (c, i) => {
                      const globalIndex = (currentPage - 1) * pageSize + i + 1;
                      return `
                    <tr>
                        <td style="color:var(--text-muted);font-size:12px">${globalIndex}</td>
                        <td>
                            <span style="font-family:'DM Mono',monospace;font-size:12px;font-weight:600;
                                         background:#f0f4f8;padding:4px 10px;border-radius:6px;
                                         color:var(--primary);">
                                ${c.courseCode}
                            </span>
                        </td>
                        <td>
                            <strong style="font-size:13.5px">${c.courseName}</strong>
                        </td>
                        <td>
                            <span style="display:inline-flex;align-items:center;gap:6px;
                                         font-size:12px;font-weight:600;
                                         color:${deptColorMap[c.department]};">
                                <span style="width:7px;height:7px;border-radius:50%;
                                             background:${deptColorMap[c.department]};
                                             flex-shrink:0;"></span>
                                ${c.department}
                            </span>
                        </td>
                        <td>
                            <span class="badge-custom ${levelColors[c.level] || "badge-muted"}">
                                Level ${c.level}
                            </span>
                        </td>
                        <td style="text-align:center;">
                            <span class="badge-custom badge-muted">${c.credits} cr</span>
                        </td>
                        <td>
                            <div style="display:flex;gap:6px;">
                                <button class="btn-edit-custom" onclick="openEditModal(${c.courseId})">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn-danger-custom" onclick="deleteCourse(${c.courseId}, '${c.courseCode}')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;}
                  )
                  .join("")}
            </tbody>
        </table>
        </div>
        <div id="courses-pagination"></div>`;
        
        renderPagination(currentFilteredCourses.length, currentPage, pageSize, "courses-pagination", "goToPage");
      }
      
      window.goToPage = function(page) {
          currentPage = page;
          renderTable();
      };

      // ============================================================
      // FILTER
      // ============================================================
      function filterCourses() {
        const search = document
          .getElementById("search-input")
          .value.toLowerCase();
        const level = document.getElementById("level-filter").value;
        const dept = document.getElementById("dept-filter").value;

        currentFilteredCourses = allCourses.filter((c) => {
          const matchSearch =
            !search ||
            c.courseCode.toLowerCase().includes(search) ||
            c.courseName.toLowerCase().includes(search);
          const matchLevel = !level || c.level.toString() === level;
          const matchDept = !dept || c.department === dept;
          return matchSearch && matchLevel && matchDept;
        });
        currentPage = 1;
        renderTable();
      }

      // ============================================================
      // OPEN ADD MODAL
      // ============================================================
      function openAddModal() {
        editingCourseId = null;
        document.getElementById("modal-title").textContent = "Add New Course";
        document.getElementById("save-btn-text").textContent = "Save Course";
        document.getElementById("modal-alert").innerHTML = "";
        clearForm();
        courseModal.show();
      }

      // ============================================================
      // OPEN EDIT MODAL
      // ============================================================
      async function openEditModal(id) {
        editingCourseId = id;
        document.getElementById("modal-title").textContent = "Edit Course";
        document.getElementById("save-btn-text").textContent = "Update Course";
        document.getElementById("modal-alert").innerHTML = "";
        try {
          const c = await apiGet(`/courses/${id}`);
          document.getElementById("f-courseCode").value = c.courseCode;
          document.getElementById("f-courseName").value = c.courseName;
          document.getElementById("f-credits").value = c.credits;
          document.getElementById("f-department").value = c.department;
          document.getElementById("f-level").value = c.level;
          courseModal.show();
        } catch (err) {
          showToast("Could not load course details", "danger");
        }
      }

      // ============================================================
      // SAVE
      // ============================================================
      async function saveCourse() {
        const courseCode = document.getElementById("f-courseCode").value.trim();
        const courseName = document.getElementById("f-courseName").value.trim();
        const credits = document.getElementById("f-credits").value;
        const department = document.getElementById("f-department").value.trim();
        const level = document.getElementById("f-level").value;

        if (!courseCode || !courseName || !credits || !department || !level) {
          showModalAlert("Please fill in all required fields.", "danger");
          return;
        }

        const payload = {
          courseCode,
          courseName,
          department,
          credits: parseInt(credits),
          level: parseInt(level),
        };

        try {
          if (editingCourseId) {
            await apiPut(`/courses/${editingCourseId}`, payload);
            showToast("Course updated successfully!", "success");
          } else {
            await apiPost("/courses", payload);
            showToast("Course added successfully!", "success");
          }
          courseModal.hide();
          loadCourses();
        } catch (err) {
          showModalAlert(err.message, "danger");
        }
      }

      // ============================================================
      // DELETE
      // ============================================================
      async function deleteCourse(id, code) {
        if (!confirmDelete(`Delete course "${code}"? This cannot be undone.`))
          return;
        try {
          await apiDelete(`/courses/${id}`);
          showToast(`Course "${code}" deleted.`, "success");
          loadCourses();
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      // ============================================================
      // HELPERS
      // ============================================================
      function clearForm() {
        ["f-courseCode", "f-courseName", "f-credits", "f-department"].forEach(
          (id) => {
            document.getElementById(id).value = "";
          },
        );
        document.getElementById("f-level").value = "";
      }

      function showModalAlert(message, type) {
        const colors = {
          danger: "alert-danger-custom",
          success: "alert-success-custom",
        };
        const icons = {
          danger: "bi-x-circle-fill",
          success: "bi-check-circle-fill",
        };
        document.getElementById("modal-alert").innerHTML = `
        <div class="alert-custom ${colors[type]}">
            <i class="bi ${icons[type]}"></i> ${message}
        </div>`;
      }
    </script>
  </body>
</html>
