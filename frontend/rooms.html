<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms - University Scheduling System</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-brand">
        <div class="sidebar-brand-icon">🎓</div>
        <div class="sidebar-brand-text">
          <span>UniSchedule</span>
          <span>Management System</span>
        </div>
      </a>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <a href="dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <div class="sidebar-section-label">Resources</div>
        <a href="rooms.html" class="sidebar-link">
          <i class="bi bi-building"></i> Rooms
        </a>
        <a href="teachers.html" class="sidebar-link">
          <i class="bi bi-person-badge"></i> Teachers
        </a>
        <a href="students.html" class="sidebar-link">
          <i class="bi bi-people"></i> Students
        </a>
        <a href="courses.html" class="sidebar-link">
          <i class="bi bi-book"></i> Courses
        </a>
        <div class="sidebar-section-label">Scheduling</div>
        <a href="classes.html" class="sidebar-link">
          <i class="bi bi-journals"></i> Classes
        </a>
        <a href="schedules.html" class="sidebar-link">
          <i class="bi bi-calendar3"></i> Schedules
        </a>
        <a href="enrolments.html" class="sidebar-link">
          <i class="bi bi-person-check"></i> Enrolments
        </a>
      </nav>
      <div class="sidebar-footer">University Scheduling System &copy; 2025</div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">Rooms</span>
          <span class="topbar-subtitle"
            >Manage all classrooms and laboratories</span
          >
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <button class="btn-primary-custom" onclick="openAddModal()">
            <i class="bi bi-plus-lg"></i> Add Room
          </button>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content">
        <!-- ALERT AREA -->
        <div id="alert-area"></div>

        <!-- ROOMS TABLE CARD -->
        <div class="card">
          <div class="card-header-custom">
            <h5><i class="bi bi-building"></i> All Rooms</h5>
            <span
              id="room-count"
              style="
                font-size: 12px;
                color: var(--text-muted);
                font-weight: 500;
              "
            ></span>
          </div>
          <div class="card-body-custom p-0">
            <div id="rooms-table-container">
              <div class="loading-state">
                <div class="spinner-custom"></div>
                <p>Loading rooms...</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ============================================================
     ADD / EDIT MODAL
     ============================================================ -->
    <div class="modal fade" id="roomModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content"
          style="
            border-radius: var(--radius-lg);
            border: none;
            overflow: hidden;
          "
        >
          <div class="modal-header-custom">
            <h5 id="modal-title">Add New Room</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" style="padding: 24px">
            <div id="modal-alert"></div>

            <div class="row g-3">
              <div class="col-6">
                <label class="form-label-custom">Room Code *</label>
                <input
                  type="text"
                  id="f-roomCode"
                  class="form-control-custom"
                  placeholder="e.g. SCI-101"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Building *</label>
                <input
                  type="text"
                  id="f-building"
                  class="form-control-custom"
                  placeholder="e.g. Science Block"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Capacity *</label>
                <input
                  type="number"
                  id="f-capacity"
                  class="form-control-custom"
                  placeholder="e.g. 80"
                  min="1"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Room Type *</label>
                <select id="f-roomType" class="form-control-custom">
                  <option value="">-- Select Type --</option>
                  <option value="LECTURE_HALL">Lecture Hall</option>
                  <option value="LAB">Lab</option>
                  <option value="SEMINAR_ROOM">Seminar Room</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label-custom">Has Projector?</label>
                <select id="f-hasProjector" class="form-control-custom">
                  <option value="false">No</option>
                  <option value="true">Yes</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label-custom">Has Computers?</label>
                <select id="f-hasComputers" class="form-control-custom">
                  <option value="false">No</option>
                  <option value="true">Yes</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Status</label>
                <select id="f-isActive" class="form-control-custom">
                  <option value="true">Active</option>
                  <option value="false">Inactive</option>
                </select>
              </div>
            </div>
          </div>
          <div
            class="modal-footer"
            style="padding: 16px 24px; border-top: 1px solid var(--border)"
          >
            <button
              type="button"
              class="btn-danger-custom"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn-primary-custom"
              onclick="saveRoom()"
            >
              <i class="bi bi-check-lg"></i>
              <span id="save-btn-text">Save Room</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script>
      let editingRoomId = null;
      let roomModal;

      document.addEventListener("DOMContentLoaded", () => {
        roomModal = new bootstrap.Modal(document.getElementById("roomModal"));
        loadRooms();
      });

      // ============================================================
      // LOAD ALL ROOMS
      // ============================================================
      async function loadRooms() {
        const container = document.getElementById("rooms-table-container");
        try {
          const rooms = await apiGet("/rooms");
          document.getElementById("room-count").textContent =
            `${rooms.length} room(s) total`;

          if (rooms.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-building"></i>
                    <p>No rooms found. Click "Add Room" to get started.</p>
                </div>`;
            return;
          }

          container.innerHTML = `
            <div style="overflow-x:auto;">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Room Code</th>
                        <th>Building</th>
                        <th>Capacity</th>
                        <th>Type</th>
                        <th>Projector</th>
                        <th>Computers</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${rooms
                      .map(
                        (r, i) => `
                        <tr>
                            <td style="color:var(--text-muted);font-size:12px">${i + 1}</td>
                            <td><strong style="font-family:'DM Mono',monospace;font-size:13px">${r.roomCode}</strong></td>
                            <td>${r.building}</td>
                            <td>
                                <span style="display:inline-flex;align-items:center;gap:5px;">
                                    <i class="bi bi-people" style="color:var(--text-muted);font-size:12px"></i>
                                    ${r.capacity}
                                </span>
                            </td>
                            <td><span class="badge-custom badge-primary">${formatRoomType(r.roomType)}</span></td>
                            <td>${
                              r.hasProjector
                                ? '<span class="badge-custom badge-success"><i class="bi bi-check"></i> Yes</span>'
                                : '<span class="badge-custom badge-muted">No</span>'
                            }</td>
                            <td>${
                              r.hasComputers
                                ? '<span class="badge-custom badge-success"><i class="bi bi-check"></i> Yes</span>'
                                : '<span class="badge-custom badge-muted">No</span>'
                            }</td>
                            <td>${
                              r.isActive
                                ? '<span class="badge-custom badge-success">Active</span>'
                                : '<span class="badge-custom badge-danger">Inactive</span>'
                            }</td>
                            <td>
                                <div style="display:flex;gap:6px;">
                                    <button class="btn-edit-custom" onclick="openEditModal(${r.roomId})">
                                        <i class="bi bi-pencil"></i> Edit
                                    </button>
                                    <button class="btn-danger-custom" onclick="deleteRoom(${r.roomId}, '${r.roomCode}')">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `,
                      )
                      .join("")}
                </tbody>
            </table>
            </div>`;
        } catch (err) {
          container.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin:24px;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Failed to load rooms: ${err.message}
            </div>`;
        }
      }

      // ============================================================
      // FORMAT HELPERS
      // ============================================================
      function formatRoomType(type) {
        return (
          {
            LECTURE_HALL: "Lecture Hall",
            LAB: "Lab",
            SEMINAR_ROOM: "Seminar Room",
          }[type] || type
        );
      }

      // ============================================================
      // OPEN ADD MODAL
      // ============================================================
      function openAddModal() {
        editingRoomId = null;
        document.getElementById("modal-title").textContent = "Add New Room";
        document.getElementById("save-btn-text").textContent = "Save Room";
        document.getElementById("modal-alert").innerHTML = "";
        clearForm();
        roomModal.show();
      }

      // ============================================================
      // OPEN EDIT MODAL
      // ============================================================
      async function openEditModal(id) {
        editingRoomId = id;
        document.getElementById("modal-title").textContent = "Edit Room";
        document.getElementById("save-btn-text").textContent = "Update Room";
        document.getElementById("modal-alert").innerHTML = "";

        try {
          const room = await apiGet(`/rooms/${id}`);
          document.getElementById("f-roomCode").value = room.roomCode;
          document.getElementById("f-building").value = room.building;
          document.getElementById("f-capacity").value = room.capacity;
          document.getElementById("f-roomType").value = room.roomType;
          document.getElementById("f-hasProjector").value =
            room.hasProjector.toString();
          document.getElementById("f-hasComputers").value =
            room.hasComputers.toString();
          document.getElementById("f-isActive").value =
            room.isActive.toString();
          roomModal.show();
        } catch (err) {
          showToast("Could not load room details", "danger");
        }
      }

      // ============================================================
      // SAVE (CREATE OR UPDATE)
      // ============================================================
      async function saveRoom() {
        const roomCode = document.getElementById("f-roomCode").value.trim();
        const building = document.getElementById("f-building").value.trim();
        const capacity = document.getElementById("f-capacity").value;
        const roomType = document.getElementById("f-roomType").value;
        const hasProjector =
          document.getElementById("f-hasProjector").value === "true";
        const hasComputers =
          document.getElementById("f-hasComputers").value === "true";
        const isActive = document.getElementById("f-isActive").value === "true";

        // Basic validation
        if (!roomCode || !building || !capacity || !roomType) {
          showModalAlert("Please fill in all required fields.", "danger");
          return;
        }

        const payload = {
          roomCode,
          building,
          roomType,
          hasProjector,
          hasComputers,
          isActive,
          capacity: parseInt(capacity),
        };

        try {
          if (editingRoomId) {
            await apiPut(`/rooms/${editingRoomId}`, payload);
            showToast("Room updated successfully!", "success");
          } else {
            await apiPost("/rooms", payload);
            showToast("Room added successfully!", "success");
          }
          roomModal.hide();
          loadRooms();
        } catch (err) {
          showModalAlert(err.message, "danger");
        }
      }

      // ============================================================
      // DELETE
      // ============================================================
      async function deleteRoom(id, code) {
        if (!confirmDelete(`Delete room "${code}"? This cannot be undone.`))
          return;
        try {
          await apiDelete(`/rooms/${id}`);
          showToast(`Room "${code}" deleted.`, "success");
          loadRooms();
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      // ============================================================
      // HELPERS
      // ============================================================
      function clearForm() {
        ["f-roomCode", "f-building", "f-capacity"].forEach((id) => {
          document.getElementById(id).value = "";
        });
        document.getElementById("f-roomType").value = "";
        document.getElementById("f-hasProjector").value = "false";
        document.getElementById("f-hasComputers").value = "false";
        document.getElementById("f-isActive").value = "true";
      }

      function showModalAlert(message, type) {
        const colors = {
          danger: "alert-danger-custom",
          success: "alert-success-custom",
          warning: "alert-warning-custom",
        };
        const icons = {
          danger: "bi-x-circle-fill",
          success: "bi-check-circle-fill",
          warning: "bi-exclamation-triangle-fill",
        };
        document.getElementById("modal-alert").innerHTML = `
        <div class="alert-custom ${colors[type]}">
            <i class="bi ${icons[type]}"></i> ${message}
        </div>`;
      }
    </script>
  </body>
</html>
