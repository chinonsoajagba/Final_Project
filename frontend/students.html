<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students - University Scheduling System</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-brand">
        <div class="sidebar-brand-icon">🎓</div>
        <div class="sidebar-brand-text">
          <span>UniSchedule</span>
          <span>Management System</span>
        </div>
      </a>
      <nav class="sidebar-nav" id="dynamic-sidebar-nav">
    <!-- populated dynamically by base.js based on role -->
</nav>
      <div class="sidebar-footer">University Scheduling System &copy; 2025</div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP BAR -->
      <header class="topbar">
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-left">
          <span class="topbar-title">Students</span>
          <span class="topbar-subtitle">Manage all registered students</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <span id="topbar-user"
                style="font-size:12px;color:var(--text-secondary);font-weight:500;">
          </span>
          <span id="topbar-role" class="topbar-badge"></span>
          <button onclick="logout()"
                  style="background:#fee2e2;color:#dc2626;border:none;
                         padding:7px 14px;border-radius:8px;font-size:12px;
                         font-weight:600;cursor:pointer;
                         font-family:'DM Sans',sans-serif;
                         display:flex;align-items:center;gap:6px;
                         transition:var(--transition);"
                  onmouseover="this.style.background='#fecaca'"
                  onmouseout="this.style.background='#fee2e2'">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
          <button class="btn-primary-custom" onclick="openAddModal()">
            <i class="bi bi-plus-lg"></i> Add Student
          </button>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content">
        <div id="alert-area"></div>

        <!-- FILTER BAR -->
        <div
          style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap"
        >
          <div style="position: relative; flex: 1; min-width: 200px">
            <i
              class="bi bi-search"
              style="
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                font-size: 14px;
              "
            ></i>
            <input
              type="text"
              id="search-input"
              placeholder="Search by name or email..."
              oninput="filterStudents()"
              style="
                width: 100%;
                padding: 9px 14px 9px 36px;
                border: 1.5px solid var(--border);
                border-radius: 8px;
                font-size: 13.5px;
                font-family: &quot;DM Sans&quot;, sans-serif;
                color: var(--text-primary);
                background: white;
              "
            />
          </div>
          <select
            id="year-filter"
            onchange="filterStudents()"
            style="
              padding: 9px 14px;
              border: 1.5px solid var(--border);
              border-radius: 8px;
              font-size: 13.5px;
              font-family: &quot;DM Sans&quot;, sans-serif;
              color: var(--text-primary);
              background: white;
              min-width: 140px;
            "
          >
            <option value="">All Years</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
          </select>
          <select
            id="status-filter"
            onchange="filterStudents()"
            style="
              padding: 9px 14px;
              border: 1.5px solid var(--border);
              border-radius: 8px;
              font-size: 13.5px;
              font-family: &quot;DM Sans&quot;, sans-serif;
              color: var(--text-primary);
              background: white;
              min-width: 140px;
            "
          >
            <option value="">All Statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="GRADUATED">Graduated</option>
            <option value="SUSPENDED">Suspended</option>
          </select>
        </div>

        <!-- TABLE CARD -->
        <div class="card">
          <div class="card-header-custom">
            <h5><i class="bi bi-people"></i> All Students</h5>
            <span
              id="student-count"
              style="
                font-size: 12px;
                color: var(--text-muted);
                font-weight: 500;
              "
            ></span>
          </div>
          <div class="card-body-custom p-0">
            <div id="students-table-container">
              <div class="loading-state">
                <div class="spinner-custom"></div>
                <p>Loading students...</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal fade" id="studentModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div
          class="modal-content"
          style="
            border-radius: var(--radius-lg);
            border: none;
            overflow: hidden;
          "
        >
          <div class="modal-header-custom">
            <h5 id="modal-title">Add New Student</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" style="padding: 24px">
            <div id="modal-alert"></div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label-custom">First Name *</label>
                <input
                  type="text"
                  id="f-firstName"
                  class="form-control-custom"
                  placeholder="e.g. Emeka"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Last Name *</label>
                <input
                  type="text"
                  id="f-lastName"
                  class="form-control-custom"
                  placeholder="e.g. Okafor"
                />
              </div>
              <div class="col-12">
                <label class="form-label-custom">Email *</label>
                <input
                  type="email"
                  id="f-email"
                  class="form-control-custom"
                  placeholder="e.g. e.okafor@student.ac.uk"
                />
              </div>
              <div class="col-12">
                <label class="form-label-custom">Program *</label>
                <input
                  type="text"
                  id="f-program"
                  class="form-control-custom"
                  placeholder="e.g. BSc Computer Science"
                />
              </div>
              <div class="col-6">
                <label class="form-label-custom">Year of Study *</label>
                <select id="f-yearOfStudy" class="form-control-custom">
                  <option value="">-- Select Year --</option>
                  <option value="1">Year 1</option>
                  <option value="2">Year 2</option>
                  <option value="3">Year 3</option>
                  <option value="4">Year 4</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label-custom">Enrolment Status</label>
                <select id="f-enrolmentStatus" class="form-control-custom">
                  <option value="ACTIVE">Active</option>
                  <option value="GRADUATED">Graduated</option>
                  <option value="SUSPENDED">Suspended</option>
                </select>
              </div>
            </div>
          </div>
          <div
            class="modal-footer"
            style="padding: 16px 24px; border-top: 1px solid var(--border)"
          >
            <button
              type="button"
              class="btn-danger-custom"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn-primary-custom"
              onclick="saveStudent()"
            >
              <i class="bi bi-check-lg"></i>
              <span id="save-btn-text">Save Student</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script>
      let editingStudentId = null;
      let studentModal;
      let allStudents = [];

      document.addEventListener("DOMContentLoaded", () => {
        if (!requireAuth(['ADMIN', 'ENROLLMENT_OFFICER'])) return;
        studentModal = new bootstrap.Modal(
          document.getElementById("studentModal"),
        );
        loadStudents();
      });

      // ============================================================
      // LOAD ALL STUDENTS
      // ============================================================
      async function loadStudents() {
        const container = document.getElementById("students-table-container");
        try {
          allStudents = await apiGet("/students");
          renderTable(allStudents);
        } catch (err) {
          container.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin:24px;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Failed to load students: ${err.message}
            </div>`;
        }
      }

      // ============================================================
      // RENDER TABLE
      // ============================================================
      function renderTable(students) {
        const container = document.getElementById("students-table-container");
        document.getElementById("student-count").textContent =
          `${students.length} student(s)`;

        if (students.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-people"></i>
                <p>No students found.</p>
            </div>`;
          return;
        }

        const yearColors = {
          1: "badge-success",
          2: "badge-info",
          3: "badge-warning",
          4: "badge-primary",
        };
        const statusBadge = {
          ACTIVE: "badge-success",
          GRADUATED: "badge-primary",
          SUSPENDED: "badge-danger",
        };

        container.innerHTML = `
        <div style="overflow-x:auto;">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Program</th>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${students
                  .map(
                    (s, i) => `
                    <tr>
                        <td style="color:var(--text-muted);font-size:12px">${i + 1}</td>
                        <td>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div style="width:34px;height:34px;border-radius:50%;
                                            background:linear-gradient(135deg,#16a34a,#0891b2);
                                            color:white;display:flex;align-items:center;
                                            justify-content:center;font-size:13px;
                                            font-weight:700;flex-shrink:0;">
                                    ${s.firstName.charAt(0)}${s.lastName.charAt(0)}
                                </div>
                                <strong style="font-size:13.5px">${s.firstName} ${s.lastName}</strong>
                            </div>
                        </td>
                        <td style="font-size:13px;color:var(--text-secondary)">${s.email}</td>
                        <td style="font-size:13px">${s.program}</td>
                        <td>
                            <span class="badge-custom ${yearColors[s.yearOfStudy] || "badge-muted"}">
                                Year ${s.yearOfStudy}
                            </span>
                        </td>
                        <td>
                            <span class="badge-custom ${statusBadge[s.enrolmentStatus] || "badge-muted"}">
                                ${s.enrolmentStatus}
                            </span>
                        </td>
                        <td>
                            <div style="display:flex;gap:6px;">
                                <button class="btn-edit-custom" onclick="openEditModal(${s.studentId})">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn-danger-custom" onclick="deleteStudent(${s.studentId}, '${s.firstName} ${s.lastName}')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `,
                  )
                  .join("")}
            </tbody>
        </table>
        </div>`;
      }

      // ============================================================
      // FILTER
      // ============================================================
      function filterStudents() {
        const search = document
          .getElementById("search-input")
          .value.toLowerCase();
        const year = document.getElementById("year-filter").value;
        const status = document.getElementById("status-filter").value;

        const filtered = allStudents.filter((s) => {
          const matchSearch =
            !search ||
            `${s.firstName} ${s.lastName}`.toLowerCase().includes(search) ||
            s.email.toLowerCase().includes(search);
          const matchYear = !year || s.yearOfStudy.toString() === year;
          const matchStatus = !status || s.enrolmentStatus === status;
          return matchSearch && matchYear && matchStatus;
        });

        renderTable(filtered);
      }

      // ============================================================
      // OPEN ADD MODAL
      // ============================================================
      function openAddModal() {
        editingStudentId = null;
        document.getElementById("modal-title").textContent = "Add New Student";
        document.getElementById("save-btn-text").textContent = "Save Student";
        document.getElementById("modal-alert").innerHTML = "";
        clearForm();
        studentModal.show();
      }

      // ============================================================
      // OPEN EDIT MODAL
      // ============================================================
      async function openEditModal(id) {
        editingStudentId = id;
        document.getElementById("modal-title").textContent = "Edit Student";
        document.getElementById("save-btn-text").textContent = "Update Student";
        document.getElementById("modal-alert").innerHTML = "";
        try {
          const s = await apiGet(`/students/${id}`);
          document.getElementById("f-firstName").value = s.firstName;
          document.getElementById("f-lastName").value = s.lastName;
          document.getElementById("f-email").value = s.email;
          document.getElementById("f-program").value = s.program;
          document.getElementById("f-yearOfStudy").value = s.yearOfStudy;
          document.getElementById("f-enrolmentStatus").value =
            s.enrolmentStatus;
          studentModal.show();
        } catch (err) {
          showToast("Could not load student details", "danger");
        }
      }

      // ============================================================
      // SAVE
      // ============================================================
      async function saveStudent() {
        const firstName = document.getElementById("f-firstName").value.trim();
        const lastName = document.getElementById("f-lastName").value.trim();
        const email = document.getElementById("f-email").value.trim();
        const program = document.getElementById("f-program").value.trim();
        const yearOfStudy = document.getElementById("f-yearOfStudy").value;
        const enrolmentStatus =
          document.getElementById("f-enrolmentStatus").value;

        if (!firstName || !lastName || !email || !program || !yearOfStudy) {
          showModalAlert("Please fill in all required fields.", "danger");
          return;
        }

        const payload = {
          firstName,
          lastName,
          email,
          program,
          enrolmentStatus,
          yearOfStudy: parseInt(yearOfStudy),
        };

        try {
          if (editingStudentId) {
            await apiPut(`/students/${editingStudentId}`, payload);
            showToast("Student updated successfully!", "success");
          } else {
            await apiPost("/students", payload);
            showToast("Student added successfully!", "success");
          }
          studentModal.hide();
          loadStudents();
        } catch (err) {
          showModalAlert(err.message, "danger");
        }
      }

      // ============================================================
      // DELETE
      // ============================================================
      async function deleteStudent(id, name) {
        if (!confirmDelete(`Delete student "${name}"? This cannot be undone.`))
          return;
        try {
          await apiDelete(`/students/${id}`);
          showToast(`Student "${name}" deleted.`, "success");
          loadStudents();
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      // ============================================================
      // HELPERS
      // ============================================================
      function clearForm() {
        ["f-firstName", "f-lastName", "f-email", "f-program"].forEach((id) => {
          document.getElementById(id).value = "";
        });
        document.getElementById("f-yearOfStudy").value = "";
        document.getElementById("f-enrolmentStatus").value = "ACTIVE";
      }

      function showModalAlert(message, type) {
        const colors = {
          danger: "alert-danger-custom",
          success: "alert-success-custom",
        };
        const icons = {
          danger: "bi-x-circle-fill",
          success: "bi-check-circle-fill",
        };
        document.getElementById("modal-alert").innerHTML = `
        <div class="alert-custom ${colors[type]}">
            <i class="bi ${icons[type]}"></i> ${message}
        </div>`;
      }
    </script>
  </body>
</html>
