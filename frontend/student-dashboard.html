<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard - University Scheduling System</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <!-- SIDEBAR - simplified for student -->
    <aside class="sidebar">
      <a href="student-dashboard.html" class="sidebar-brand">
        <div class="sidebar-brand-icon">🎓</div>
        <div class="sidebar-brand-text">
          <span>UniSchedule</span>
          <span>Student Portal</span>
        </div>
      </a>
      <nav class="sidebar-nav" id="dynamic-sidebar-nav">
        <!-- populated dynamically by base.js based on role -->
      </nav>
      <div class="sidebar-footer">University Scheduling System &copy; 2025</div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">Student Dashboard</span>
          <span class="topbar-subtitle"
            >Your classes, schedule and enrolment status</span
          >
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <span
            id="topbar-user"
            style="
              font-size: 12px;
              color: var(--text-secondary);
              font-weight: 500;
            "
          >
          </span>
          <span id="topbar-role" class="topbar-badge"></span>
          <button
            onclick="logout()"
            style="
              background: #fee2e2;
              color: #dc2626;
              border: none;
              padding: 7px 14px;
              border-radius: 8px;
              font-size: 12px;
              font-weight: 600;
              cursor: pointer;
              font-family: &quot;DM Sans&quot;, sans-serif;
              display: flex;
              align-items: center;
              gap: 6px;
              transition: var(--transition);
            "
            onmouseover="this.style.background = '#fecaca'"
            onmouseout="this.style.background = '#fee2e2'"
          >
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content">
        <!-- STUDENT PROFILE CARD -->
        <div id="profile-section">
          <div class="loading-state">
            <div class="spinner-custom"></div>
            <p>Loading your profile...</p>
          </div>
        </div>

        <!-- ENROLMENTS + TIMETABLE -->
        <div class="row g-4 mt-1">
          <!-- MY ENROLLED CLASSES -->
          <div class="col-lg-6">
            <div class="card h-100">
              <div class="card-header-custom">
                <h5><i class="bi bi-journals"></i> My Enrolled Classes</h5>
                <span
                  id="enrolment-count"
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    font-weight: 500;
                  "
                >
                </span>
              </div>
              <div class="card-body-custom p-0">
                <div id="enrolments-container">
                  <div class="loading-state">
                    <div class="spinner-custom"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- MY WEEKLY TIMETABLE -->
          <div class="col-lg-6">
            <div class="card h-100">
              <div class="card-header-custom">
                <h5><i class="bi bi-calendar3"></i> My Weekly Timetable</h5>
              </div>
              <div class="card-body-custom p-0">
                <div id="timetable-container">
                  <div class="loading-state">
                    <div class="spinner-custom"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!requireAuth(["STUDENT"])) return;
        loadProfile();
        loadEnrolments();
        loadTimetable();
      });

      // ============================================================
      // LOAD STUDENT PROFILE
      // ============================================================
      async function loadProfile() {
        const section = document.getElementById("profile-section");
        try {
          const student = await apiGet("/student-portal/me");

          const statusColor = {
            ACTIVE: "#16a34a",
            GRADUATED: "#1d4ed8",
            SUSPENDED: "#dc2626",
          };

          section.innerHTML = `
            <div style="background:linear-gradient(135deg,var(--primary-dark) 0%,
                         var(--primary-light) 100%);border-radius:var(--radius-lg);
                         padding:28px 32px;color:white;
                         display:flex;align-items:center;gap:24px;
                         flex-wrap:wrap;margin-bottom:8px;">
                <div style="width:70px;height:70px;border-radius:50%;
                             background:rgba(255,255,255,0.15);
                             display:flex;align-items:center;justify-content:center;
                             font-size:26px;font-weight:800;flex-shrink:0;">
                    ${student.firstName.charAt(0)}${student.lastName.charAt(0)}
                </div>
                <div style="flex:1;">
                    <h4 style="font-weight:800;font-size:22px;margin:0 0 4px;">
                        ${student.firstName} ${student.lastName}
                    </h4>
                    <p style="opacity:0.75;font-size:13.5px;margin:0 0 10px;">
                        ${student.email}
                    </p>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <span style="background:rgba(255,255,255,0.15);
                                     padding:4px 12px;border-radius:20px;
                                     font-size:12px;font-weight:600;">
                            <i class="bi bi-book"></i> ${student.program}
                        </span>
                        <span style="background:rgba(255,255,255,0.15);
                                     padding:4px 12px;border-radius:20px;
                                     font-size:12px;font-weight:600;">
                            <i class="bi bi-mortarboard"></i> Year ${student.yearOfStudy}
                        </span>
                        <span style="background:${statusColor[student.enrolmentStatus]}33;
                                     color:white;padding:4px 12px;border-radius:20px;
                                     font-size:12px;font-weight:600;
                                     border:1px solid rgba(255,255,255,0.3);">
                            <i class="bi bi-circle-fill"
                               style="font-size:7px;vertical-align:middle;"></i>
                            ${student.enrolmentStatus}
                        </span>
                    </div>
                </div>
            </div>`;
        } catch (err) {
          section.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin-bottom:16px;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Could not load profile: ${err.message}
            </div>`;
        }
      }

      // ============================================================
      // LOAD MY ENROLMENTS
      // ============================================================
      async function loadEnrolments() {
        const container = document.getElementById("enrolments-container");
        try {
          const enrolments = await apiGet("/student-portal/my-enrolments");
          const active = enrolments.filter((e) => e.status === "ENROLLED");
          document.getElementById("enrolment-count").textContent =
            `${active.length} active`;

          if (enrolments.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-journals"></i>
                    <p>You are not enrolled in any classes yet.</p>
                </div>`;
            return;
          }

          const statusBadge = {
            ENROLLED: "badge-success",
            DROPPED: "badge-danger",
            COMPLETED: "badge-muted",
          };

          container.innerHTML = `
            <div style="overflow-x:auto;">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Section</th>
                        <th>Semester</th>
                        <th>Room</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${enrolments
                      .map(
                        (e) => `
                        <tr>
                            <td>
                                <span style="font-family:'DM Mono',monospace;
                                             font-size:12px;font-weight:600;
                                             color:var(--primary);background:#f0f4f8;
                                             padding:3px 8px;border-radius:5px;">
                                    ${e.classSection.course.courseCode}
                                </span>
                                <div style="font-size:11px;color:var(--text-muted);
                                            margin-top:3px;">
                                    ${e.classSection.course.courseName}
                                </div>
                            </td>
                            <td style="font-weight:600;">
                                Section ${e.classSection.sectionNumber}
                            </td>
                            <td>
                                <span class="badge-custom badge-info">
                                    ${e.classSection.semester}
                                </span>
                            </td>
                            <td style="font-size:13px;">
                                ${
                                  e.classSection.room
                                    ? e.classSection.room.roomCode
                                    : '<span style="color:var(--text-muted);">TBA</span>'
                                }
                            </td>
                            <td>
                                <span class="badge-custom
                                    ${statusBadge[e.status] || "badge-muted"}">
                                    ${e.status}
                                </span>
                            </td>
                        </tr>
                    `,
                      )
                      .join("")}
                </tbody>
            </table>
            </div>`;
        } catch (err) {
          container.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin:16px;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Could not load enrolments: ${err.message}
            </div>`;
        }
      }

      // ============================================================
      // LOAD MY TIMETABLE
      // ============================================================
      async function loadTimetable() {
        const container = document.getElementById("timetable-container");
        try {
          const schedule = await apiGet("/student-portal/my-schedule");

          if (schedule.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-calendar3"></i>
                    <p>No schedule slots found for your classes.</p>
                </div>`;
            return;
          }

          // Group by day
          const dayOrder = ["MON", "TUE", "WED", "THU", "FRI"];
          const dayLabels = {
            MON: "Monday",
            TUE: "Tuesday",
            WED: "Wednesday",
            THU: "Thursday",
            FRI: "Friday",
          };
          const dayColors = {
            MON: "#2a5298",
            TUE: "#0891b2",
            WED: "#16a34a",
            THU: "#d97706",
            FRI: "#7c3aed",
          };

          const grouped = {};
          dayOrder.forEach((d) => (grouped[d] = []));
          schedule.forEach((s) => {
            if (grouped[s.day]) grouped[s.day].push(s);
          });

          // Sort each day by start time
          dayOrder.forEach((d) => {
            grouped[d].sort((a, b) => a.startTime.localeCompare(b.startTime));
          });

          const activeDays = dayOrder.filter((d) => grouped[d].length > 0);

          container.innerHTML = `
            <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
                ${activeDays
                  .map(
                    (day) => `
                    <div style="border-radius:10px;overflow:hidden;
                                border:1.5px solid var(--border);">
                        <div style="background:${dayColors[day]};color:white;
                                    padding:8px 16px;font-size:12px;
                                    font-weight:700;letter-spacing:0.5px;">
                            ${dayLabels[day]}
                        </div>
                        <div style="padding:0;">
                            ${grouped[day]
                              .map(
                                (s) => `
                                <div style="display:flex;align-items:center;
                                            gap:14px;padding:12px 16px;
                                            border-bottom:1px solid #f0f4f8;">
                                    <div style="font-family:'DM Mono',monospace;
                                                font-size:12px;font-weight:600;
                                                color:var(--text-secondary);
                                                white-space:nowrap;min-width:100px;">
                                        ${s.startTime.substring(0, 5)}
                                        -
                                        ${s.endTime.substring(0, 5)}
                                    </div>
                                    <div style="flex:1;">
                                        <div style="font-weight:700;font-size:13px;">
                                            ${s.courseCode}
                                            <span style="font-weight:400;
                                                         color:var(--text-muted);
                                                         font-size:12px;">
                                                Section ${s.section}
                                            </span>
                                        </div>
                                        <div style="font-size:11px;
                                                    color:var(--text-muted);
                                                    margin-top:2px;">
                                            ${s.courseName}
                                        </div>
                                    </div>
                                    <div style="display:flex;align-items:center;
                                                gap:5px;font-size:12px;
                                                color:var(--text-secondary);">
                                        <i class="bi bi-building"
                                           style="font-size:11px;"></i>
                                        ${s.room}
                                    </div>
                                </div>
                            `,
                              )
                              .join("")}
                        </div>
                    </div>
                `,
                  )
                  .join("")}
            </div>`;
        } catch (err) {
          container.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin:16px;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Could not load timetable: ${err.message}
            </div>`;
        }
      }
    </script>
  </body>
</html>
