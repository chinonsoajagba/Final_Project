<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users - University Scheduling System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
        .role-pill {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid var(--border);
            color: var(--text-secondary);
            background: white;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            letter-spacing: 0.3px;
        }

        .role-pill.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .role-pill:hover:not(.active) {
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .badge-role {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .badge-admin {
            background: #ede9fe;
            color: #6d28d9;
        }

        .badge-enrollment {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-handler {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-student {
            background: #fef9c3;
            color: #a16207;
        }

        .badge-teacher {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-status-active {
            background: #dcfce7;
            color: #15803d;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-status-inactive {
            background: #fee2e2;
            color: #b91c1c;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a href="dashboard.html" class="sidebar-brand">
            <div class="sidebar-brand-icon">🎓</div>
            <div class="sidebar-brand-text">
                <span>UniSchedule</span>
                <span>Management System</span>
            </div>
        </a>
        <nav class="sidebar-nav" id="dynamic-sidebar-nav"></nav>
        <div class="sidebar-footer">University Scheduling System &copy; 2025</div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <!-- TOP BAR -->
        <header class="topbar">
            <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-left">
                <span class="topbar-title">User Management</span>
                <span class="topbar-subtitle">View, edit, and delete system user accounts</span>
            </div>
            <div class="topbar-right">
                <span class="topbar-date" id="topbar-date"></span>
                <span id="topbar-user" style="font-size:12px;color:var(--text-secondary);font-weight:500;"></span>
                <span id="topbar-role" class="topbar-badge"></span>
                <button onclick="logout()"
                    style="background:#fee2e2;color:#dc2626;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;transition:var(--transition);"
                    onmouseover="this.style.background='#fecaca'" onmouseout="this.style.background='#fee2e2'">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <main class="page-content">
            <div id="alert-area"></div>

            <!-- FILTER BAR -->
            <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;">
                <!-- Search -->
                <div style="position:relative;flex:1;min-width:200px;">
                    <i class="bi bi-search"
                        style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;"></i>
                    <input type="text" id="search-input" placeholder="Search by email..." oninput="filterUsers()"
                        style="width:100%;padding:9px 14px 9px 36px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;font-family:'DM Sans',sans-serif;color:var(--text-primary);background:white;" />
                </div>
                <!-- Role pills -->
                <div id="role-filter-pills" style="display:flex;gap:8px;flex-wrap:wrap;">
                    <span class="role-pill active" data-role="" onclick="setRoleFilter(this)">All</span>
                    <span class="role-pill" data-role="ADMIN" onclick="setRoleFilter(this)">Admin</span>
                    <span class="role-pill" data-role="ENROLLMENT_OFFICER" onclick="setRoleFilter(this)">Enrollment
                        Officer</span>
                    <span class="role-pill" data-role="CLASS_HANDLER" onclick="setRoleFilter(this)">Class Handler</span>
                    <span class="role-pill" data-role="STUDENT" onclick="setRoleFilter(this)">Student</span>
                    <span class="role-pill" data-role="TEACHER" onclick="setRoleFilter(this)">Teacher</span>
                </div>
            </div>

            <!-- TABLE CARD -->
            <div class="card">
                <div class="card-header-custom">
                    <h5><i class="bi bi-person-gear"></i> All Users</h5>
                    <span id="user-count" style="font-size:12px;color:var(--text-muted);font-weight:500;"></span>
                </div>
                <div class="card-body-custom p-0">
                    <div id="users-table-container">
                        <div class="loading-state">
                            <div class="spinner-custom"></div>
                            <p>Loading users...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius:var(--radius-lg);border:none;overflow:hidden;">
                <div class="modal-header-custom">
                    <h5>Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding:24px;">
                    <div id="edit-modal-alert"></div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label-custom">Email *</label>
                            <input type="email" id="edit-email" class="form-control-custom"
                                placeholder="user@example.com" />
                        </div>
                        <div class="col-12">
                            <label class="form-label-custom">Role *</label>
                            <select id="edit-role" class="form-control-custom" onchange="onEditRoleChange()">
                                <option value="ADMIN">Administrator</option>
                                <option value="ENROLLMENT_OFFICER">Enrollment Officer</option>
                                <option value="CLASS_HANDLER">Class Handler</option>
                                <option value="STUDENT">Student</option>
                                <option value="TEACHER">Teacher</option>
                            </select>
                        </div>
                        <div class="col-12" id="edit-linkedId-container">
                            <label class="form-label-custom">Linked Record (optional)</label>
                            <select id="edit-linkedId" class="form-control-custom">
                                <option value="">-- No Linked Record --</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label-custom">Status *</label>
                            <select id="edit-isActive" class="form-control-custom">
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="padding:16px 24px;border-top:1px solid var(--border);">
                    <button type="button" class="btn-danger-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-primary-custom" onclick="saveEdit()">
                        <i class="bi bi-check-lg"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- RESET PASSWORD MODAL -->
    <div class="modal fade" id="resetPwModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius:var(--radius-lg);border:none;overflow:hidden;">
                <div class="modal-header-custom">
                    <h5>Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding:24px;">
                    <div id="pw-modal-alert"></div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label-custom">New Password *</label>
                            <input type="password" id="new-password" class="form-control-custom"
                                placeholder="At least 6 characters" />
                        </div>
                        <div class="col-12">
                            <label class="form-label-custom">Confirm Password *</label>
                            <input type="password" id="confirm-password" class="form-control-custom"
                                placeholder="Repeat new password" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="padding:16px 24px;border-top:1px solid var(--border);">
                    <button type="button" class="btn-danger-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-primary-custom" onclick="saveResetPassword()">
                        <i class="bi bi-key"></i> Reset Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script>
        let allUsers = [];
        let currentFilteredUsers = [];
        let studentMap = {};
        let teacherMap = {};
        let activeRoleFilter = "";
        let editingUserId = null;
        let resetUserId = null;
        let editModal, resetPwModal;
        let currentPage = 1;
        const pageSize = 10;

        const roleBadgeMap = {
            ADMIN: '<span class="badge-role badge-admin">Admin</span>',
            ENROLLMENT_OFFICER: '<span class="badge-role badge-enrollment">Enrollment Officer</span>',
            CLASS_HANDLER: '<span class="badge-role badge-handler">Class Handler</span>',
            STUDENT: '<span class="badge-role badge-student">Student</span>',
            TEACHER: '<span class="badge-role badge-teacher">Teacher</span>',
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (!requireAuth(["ADMIN"])) return;
            editModal = new bootstrap.Modal(document.getElementById("editModal"));
            resetPwModal = new bootstrap.Modal(document.getElementById("resetPwModal"));
            loadUsers();
        });

        async function loadUsers() {
            const container = document.getElementById("users-table-container");
            try {
                const [users, students, teachers] = await Promise.all([
                    apiGet("/users"),
                    apiGet("/students").catch(() => []),
                    apiGet("/teachers").catch(() => [])
                ]);

                students.forEach(s => studentMap[s.studentId] = `${s.firstName} ${s.lastName}`);
                teachers.forEach(t => teacherMap[t.teacherId] = `${t.firstName} ${t.lastName}`);

                allUsers = users.sort((a, b) => b.userId - a.userId);
                filterUsers();
            } catch (err) {
                container.innerHTML = `
            <div class="alert-custom alert-danger-custom" style="margin:24px;">
              <i class="bi bi-exclamation-triangle-fill"></i>
              Failed to load users: ${err.message}
            </div>`;
            }
        }

        function renderTable() {
            const container = document.getElementById("users-table-container");
            document.getElementById("user-count").textContent = `${currentFilteredUsers.length} user(s)`;

            if (currentFilteredUsers.length === 0) {
                container.innerHTML = `
            <div class="empty-state">
              <i class="bi bi-people"></i>
              <p>No users found.</p>
            </div>`;
                return;
            }

            const paginatedUsers = paginateData(currentFilteredUsers, currentPage, pageSize);

            container.innerHTML = `
          <div style="overflow-x:auto;">
          <table class="table-custom">
            <thead>
              <tr>
                <th>#</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Linked Record</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${paginatedUsers.map((u, i) => {
                const globalIndex = (currentPage - 1) * pageSize + i + 1;
                return `
                <tr>
                  <td style="color:var(--text-muted);font-size:12px;">${globalIndex}</td>
                  <td style="font-size:13.5px;font-weight:500;">${u.email}</td>
                  <td>${roleBadgeMap[u.role] || u.role}</td>
                  <td>
                    ${u.isActive
                        ? '<span class="badge-status-active"><i class="bi bi-circle-fill" style="font-size:8px;margin-right:4px;"></i>Active</span>'
                        : '<span class="badge-status-inactive"><i class="bi bi-circle-fill" style="font-size:8px;margin-right:4px;"></i>Inactive</span>'}
                  </td>
                  <td style="font-size:12px;color:var(--text-muted);font-weight:600;">${
                      u.role === 'STUDENT' && u.linkedId && studentMap[u.linkedId] ? studentMap[u.linkedId] : 
                      u.role === 'TEACHER' && u.linkedId && teacherMap[u.linkedId] ? teacherMap[u.linkedId] : 
                      u.linkedId ?? '—'
                  }</td>
                  <td>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                      <button class="btn-edit-custom" onclick="openEditModal(${u.userId})">
                        <i class="bi bi-pencil"></i> Edit
                      </button>
                      <button class="btn-edit-custom" style="background:#f0f4f8;color:#0891b2;border-color:#bae6fd;" onclick="openResetPwModal(${u.userId})">
                        <i class="bi bi-key"></i> Reset PW
                      </button>
                      <button class="btn-danger-custom" onclick="deleteUser(${u.userId})">
                        <i class="bi bi-trash"></i> Delete
                      </button>
                    </div>
                  </td>
                </tr>`}).join("")}
            </tbody>
          </table>
          </div>
          <div id="users-pagination"></div>`;

            renderPagination(currentFilteredUsers.length, currentPage, pageSize, "users-pagination", "goToPage");
        }

        window.goToPage = function (page) {
            currentPage = page;
            renderTable();
        };

        // ── FILTER ──────────────────────────────────────────────────────────────
        function setRoleFilter(el) {
            document.querySelectorAll(".role-pill").forEach(p => p.classList.remove("active"));
            el.classList.add("active");
            activeRoleFilter = el.dataset.role;
            filterUsers();
        }

        function filterUsers() {
            const search = document.getElementById("search-input").value.toLowerCase();
            currentFilteredUsers = allUsers.filter(u => {
                const matchRole = !activeRoleFilter || u.role === activeRoleFilter;
                const matchSearch = !search || u.email.toLowerCase().includes(search);
                return matchRole && matchSearch;
            });
            currentPage = 1;
            renderTable();
        }

        // ── EDIT MODAL ──────────────────────────────────────────────────────────
        function onEditRoleChange() {
            const role = document.getElementById("edit-role").value;
            const select = document.getElementById("edit-linkedId");
            const container = document.getElementById("edit-linkedId-container");

            select.innerHTML = '<option value="">-- No Linked Record --</option>';

            if (role === 'STUDENT') {
                container.style.display = 'block';
                Object.entries(studentMap).forEach(([id, name]) => {
                    select.innerHTML += `<option value="${id}">${name} (ID: ${id})</option>`;
                });
            } else if (role === 'TEACHER') {
                container.style.display = 'block';
                Object.entries(teacherMap).forEach(([id, name]) => {
                    select.innerHTML += `<option value="${id}">${name} (ID: ${id})</option>`;
                });
            } else {
                container.style.display = 'none';
            }
        }

        function openEditModal(id) {
            const user = allUsers.find(u => u.userId === id);
            if (!user) return;
            editingUserId = id;
            document.getElementById("edit-email").value = user.email;
            document.getElementById("edit-role").value = user.role;
            onEditRoleChange();
            document.getElementById("edit-linkedId").value = user.linkedId != null ? user.linkedId : "";
            document.getElementById("edit-isActive").value = String(user.isActive);
            document.getElementById("edit-modal-alert").innerHTML = "";
            editModal.show();
        }

        async function saveEdit() {
            const email = document.getElementById("edit-email").value.trim();
            const role = document.getElementById("edit-role").value;
            const linkedIdValue = document.getElementById("edit-linkedId").value.trim();
            const linkedId = linkedIdValue === "" ? null : Number(linkedIdValue);
            const isActive = document.getElementById("edit-isActive").value === "true";

            if (!email) {
                showEditAlert("Email is required.", "danger"); return;
            }

            try {
                await apiFetch(`/users/${editingUserId}`, {
                    method: "PUT",
                    body: JSON.stringify({ email, role, linkedId, isActive }),
                });
                showToast("User updated successfully!", "success");
                editModal.hide();
                loadUsers();
            } catch (err) {
                showEditAlert(err.message, "danger");
            }
        }

        // ── RESET PASSWORD MODAL ─────────────────────────────────────────────────
        function openResetPwModal(id) {
            resetUserId = id;
            document.getElementById("new-password").value = "";
            document.getElementById("confirm-password").value = "";
            document.getElementById("pw-modal-alert").innerHTML = "";
            resetPwModal.show();
        }

        async function saveResetPassword() {
            const newPw = document.getElementById("new-password").value;
            const confirmPw = document.getElementById("confirm-password").value;

            if (!newPw || newPw.length < 6) {
                showPwAlert("Password must be at least 6 characters.", "danger"); return;
            }
            if (newPw !== confirmPw) {
                showPwAlert("Passwords do not match.", "danger"); return;
            }

            try {
                await apiFetch(`/users/${resetUserId}/reset-password`, {
                    method: "PUT",
                    body: JSON.stringify({ newPassword: newPw }),
                });
                showToast("Password reset successfully!", "success");
                resetPwModal.hide();
            } catch (err) {
                showPwAlert(err.message, "danger");
            }
        }

        // ── DELETE ───────────────────────────────────────────────────────────────
        async function deleteUser(id) {
            if (!confirmDelete("Delete this user account? This cannot be undone.")) return;
            try {
                await apiDelete(`/users/${id}`);
                showToast("User deleted.", "success");
                loadUsers();
            } catch (err) {
                showToast(err.message, "danger");
            }
        }

        // ── ALERT HELPERS ────────────────────────────────────────────────────────
        function showEditAlert(msg, type) {
            document.getElementById("edit-modal-alert").innerHTML = `
          <div class="alert-custom alert-${type}-custom" style="margin-bottom:12px;">
            <i class="bi bi-x-circle-fill"></i> ${msg}
          </div>`;
        }

        function showPwAlert(msg, type) {
            document.getElementById("pw-modal-alert").innerHTML = `
          <div class="alert-custom alert-${type}-custom" style="margin-bottom:12px;">
            <i class="bi bi-x-circle-fill"></i> ${msg}
          </div>`;
        }
    </script>
</body>

</html>
